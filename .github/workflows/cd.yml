name: RAG Application CD

on:
  push:
    branches:
      - main


permissions:
  contents: read
  id-token: write


jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v7


      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}


      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3


      - name: Verify authentication
        run: |
          gcloud auth list
          gcloud config get-value project


      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            ${{ vars.GCP_REGION }}-docker.pkg.dev \
            --quiet


      - name: Define image name
        run: |
          echo "IMAGE=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO }}/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}" >> "$GITHUB_ENV"


      - name: Build image
        run: |
          docker build \
            -t "$IMAGE" \
            .


      - name: Push image
        run: |
          docker push "$IMAGE"


      - name: Deploy Cloud Run
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --quiet


      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe \
            "${{ vars.CLOUD_RUN_SERVICE }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format="value(status.url)")

          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"


      - name: Verify production
        run: |
          curl --fail "$SERVICE_URL/health"